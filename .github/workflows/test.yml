name: Numerical, importer and synthetic browser checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - name: Install pinned test-only browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/afm-browser-tools" --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/afm-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Run synthetic browser integration
        run: node tests/browser-ci.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/afm-browser-tools/node_modules/playwright/index.mjs
